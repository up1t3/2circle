# JVM for Gradle daemon. JDK 21 is installed.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC

# Gradle performance
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# SDK auto-install is disabled — SDK at E:\Boltalka\android-sdk has package.xml v4
# that AGP cannot marshal, which trips a false "needs install" loop. Pin versions
# explicitly in each module instead and never invoke sdkmanager from Gradle.
android.builder.sdkDownload=false
android.suppressUnsupportedCompileSdk=35,34

# Kotlin
kotlin.code.style=official

# KSP2 — required for Kotlin 2.x. Hilt >= 2.52 supports it.
ksp.useKSP2=true
